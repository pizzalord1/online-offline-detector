<!DOCTYPE html>
<html>
<head>
  <title>Discord Status</title>
  <link rel="icon" type="image/jpeg" href="/IMG_2094.JPG">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1e1e1e;
      color: #fff;
      font-family: sans-serif;
    }

    .status-card {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;

      box-sizing: border-box;
      padding: 0.75rem 1rem;

      color: rgb(0, 0, 0);
      background-color: rgb(139, 139, 139);

      border-radius: 10px;
      border-left: 3px solid rgb(46, 46, 46);
      border-bottom: 3px solid rgb(46, 46, 46);

      box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
    }

    .avatar {
      position: absolute;
      inset: 0;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
    }

    .avatar-container {
      position: relative;
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      margin-right: 16px;
    }

    .avatar-decoration {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scale(1.15);
      pointer-events: none;
    }

    .status-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .status-row {
      display: flex;
      align-items: center;
    }

    .dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 10px;
    }

    .online {
      background: #57f287;
    }

    .idle {
      background: #fee75c;
    }

    .dnd {
      background: #ed4245;
    }

    .offline {
      background: #808080;
    }

    #status {
      font-weight: bold;
      font-size: 16px;
    }

    #activity {
      margin-top: 6px;
      font-size: 13px;
      color: #222;
      word-break: break-word;
    }

    #connect-discord {
      margin: 6px 0 0;
      color: #222;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="status-card">
    <span class="avatar-container" id="avatar-container" hidden>
      <img class="avatar" id="avatar" alt="Discord avatar">
      <img class="avatar-decoration" id="avatar-decoration" alt="" aria-hidden="true" hidden>
    </span>

    <div class="status-content">
      <div class="status-row">
        <span class="dot" id="dot"></span>
        <span id="status">Loading...</span>
      </div>

      <div id="activity">
        Loading activity...
      </div>

      <p
        id="connect-discord"
        role="note"
        aria-live="polite"
        aria-keyshortcuts="Control+Shift+/"
      >
        Press Ctrl+Shift+/ to connect Discord
      </p>
    </div>
  </div>

  <script>
    async function poll() {
      const statusLabel = document.getElementById('status');
      const activityLabel = document.getElementById('activity');

      try {
        const res = await fetch('/status', {
          cache: 'no-store'
        });

        if (!res.ok) {
          throw new Error(`Status request failed (${res.status})`);
        }

        const {
          status,
          avatar,
          avatarDecoration,
          activity
        } = await res.json();

        if (!['online', 'idle', 'dnd', 'offline'].includes(status)) {
          throw new Error('Status response was invalid');
        }

        const avatarContainer = document.getElementById('avatar-container');
        const avatarImage = document.getElementById('avatar');
        const avatarDecorationImage =
          document.getElementById('avatar-decoration');
        const connectDiscordHint =
          document.getElementById('connect-discord');
        const hasAvatarDecoration =
          typeof avatarDecoration === 'string' && avatarDecoration.length > 0;

        if (typeof avatar === 'string' && avatar.length > 0) {
          avatarImage.src = avatar;
          avatarContainer.hidden = false;
        } else {
          avatarContainer.hidden = true;
        }

        if (hasAvatarDecoration) {
          if (avatarDecorationImage.src !== avatarDecoration) {
            avatarDecorationImage.src = avatarDecoration;
          }
          avatarDecorationImage.hidden = false;
        } else {
          avatarDecorationImage.hidden = true;
        }

        const oauthResult = new URLSearchParams(location.search).get('oauth');
        connectDiscordHint.textContent =
          oauthResult === 'connected' && !hasAvatarDecoration
            ? 'Connected, but no decoration was found. Press Ctrl+Shift+/ to try again'
            : hasAvatarDecoration
              ? 'Press Ctrl+Shift+/ to refresh Discord decoration'
              : 'Press Ctrl+Shift+/ to connect Discord';

        document.getElementById('dot').className = 'dot ' + status;
        statusLabel.textContent = status.toUpperCase();

        if (activity && activity.name) {

          let activityText =
            `${activity.typeName}: ${activity.name}`;

          if (activity.details) {
            activityText += ` • ${activity.details}`;
          }

          if (activity.state) {
            activityText += ` • ${activity.state}`;
          }

          activityLabel.textContent = activityText;

        } else {
          activityLabel.textContent = 'No activity';
        }

      } catch (error) {

        console.error('Unable to load Discord status:', error);

        document.getElementById('dot').className = 'dot offline';

        statusLabel.textContent =
          'Unable to load status. Please retry.';

        activityLabel.textContent = '';
      }
    }

    document.addEventListener('keydown', event => {
      if (
        event.ctrlKey &&
        event.shiftKey &&
        !event.altKey &&
        !event.metaKey &&
        !event.repeat &&
        (event.code === 'Slash' || event.key === '?')
      ) {
        event.preventDefault();
        window.location.assign('/oauth/connect');
      }
    });

    setInterval(poll, 10000);
    poll();
  </script>
</body>
</html>
